<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PulseChat</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fb;
    }

    .chat-container {
      max-width: 500px;
      margin: 50px auto;
      border-radius: 12px;
      overflow: hidden;
      background: white;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .chat-box {
      height: 350px;
      overflow-y: auto;
      padding: 15px;
      background: #f1f3f6;
    }

    .message {
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: inline-block;
      max-width: 80%;
    }

    .me {
      background: #0d6efd;
      color: white;
      float: right;
      clear: both;
    }

    .other {
      background: #e4e6eb;
      color: black;
      float: left;
      clear: both;
    }
  </style>
</head>

<body>

<div class="chat-container">

  <!-- Header -->
  <div class="bg-primary text-white text-center p-3">
    <h5 class="mb-0">💬 PulseChat</h5>
  </div>

  <!-- Username -->
  <div class="p-3 border-bottom">
    <input type="text" id="username" class="form-control" placeholder="Enter your name">
  </div>

  <!-- Chat Box -->
  <div id="chat-box" class="chat-box">
    <!-- Messages will come here -->
  </div>

  <!-- Input -->
  <div class="p-3 border-top d-flex gap-2">
    <input type="text" id="message" class="form-control" placeholder="Type message...">
    <button id="sendBtn" class="btn btn-primary">Send</button>
  </div>

</div>

<!-- JS -->
<script type="module" src="app.js"></script>

</body>
</html>
